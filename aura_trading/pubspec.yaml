name: aura_trading
description: Shared trading logic and UI components for AURA (Forex/Gold & Saham IDX)
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  aura_core:
    path: ../aura_core
  flutter_riverpod: '>=2.4.0 <4.0.0'

  riverpod_annotation: ^4.0.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  fl_chart: ^0.69.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.1
  intl: ^0.19.0
  json_annotation: ^4.12.0
  crypto: ^3.0.3
  collection: ^1.18.0
  equatable: ^2.0.5
  html: ^0.15.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.0
  json_serializable: ^6.8.0
