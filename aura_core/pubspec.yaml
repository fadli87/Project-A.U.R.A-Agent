name: aura_core
description: Core logic A.U.R.A (inference, memory, agent loop, tool-calling) - dipakai bersama oleh aura_mobile dan aura_desktop.
version: 0.1.0
environment:
  sdk: '>=3.12.2 <4.0.0' # matches aura_mobile SDK range

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  tflite_flutter: ^0.12.1
  path: ^1.9.1
  syncfusion_flutter_pdf: ^24.2.7
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  objectbox_generator: ^5.3.2
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.aura.aura.aura_core
        pluginClass: AuraCorePlugin
      windows:
        pluginClass: AuraCorePluginCApi
      linux:
        pluginClass: AuraCorePlugin
